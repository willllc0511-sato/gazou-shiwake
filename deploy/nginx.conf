# /etc/nginx/sites-available/gazou → sites-enabled にリンク。証明書は certbot --nginx -d gazou.163-44-115-184.sslip.io
# sslip.io は住所の中の数字をそのまま IP として返す公開の名前解決（DNS の設定なしで HTTPS にできる）
# 壊れた送信（アプリの回数上限に数えられない物）も含めて、送り元ごとに1分30回まで（ペネトレーションテスト 2026-10-28）
limit_req_zone $binary_remote_addr zone=gazou:10m rate=30r/m;

server {
    listen 80;
    server_name gazou.163-44-115-184.sslip.io;
    access_log /var/log/nginx/gazou.access.log;
    client_max_body_size 11m;          # 画像1枚10MB＋送信の余白
    client_body_timeout 15s;           # 遅い送信で占有されないように
    client_header_timeout 15s;
    location /api/ {
        limit_req zone=gazou burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8610;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:8610;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;      # 外から付けられた値は上書きする
        proxy_read_timeout 30s;
    }
}
